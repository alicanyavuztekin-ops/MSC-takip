<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

  <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full space-y-6 border border-slate-200">
      <div class="text-center space-y-2">
        <div class="bg-[#002855] text-[#FFCC00] w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold shadow-md border border-yellow-400">
          <i class="fa-solid fa-ship"></i>
        </div>
        <h2 class="text-2xl font-bold text-[#002855] uppercase tracking-wide">MSC & MEDLOG TAKİP</h2>
        <p class="text-xs text-slate-500 font-medium">Liman Operasyon Sistemine Giriş Yapın</p>
      </div>

      <div class="flex border-b border-slate-200 text-sm font-semibold">
        <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-[#002855] border-b-2 border-[#002855] font-bold transition-colors">GİRİŞ YAP</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-slate-400 border-b-2 border-transparent transition-colors">KAYIT OL</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">E-POSTA ADRESİ</label>
          <input type="email" id="login-email" required class="w-full text-sm p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#002855] outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">ŞİFRE</label>
          <input type="password" id="login-password" required class="w-full text-sm p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#002855] outline-none transition-all">
        </div>
        <button type="submit" id="btn-login" class="w-full bg-[#002855] hover:bg-[#001d3d] text-[#FFCC00] font-bold p-3 rounded-lg transition-all text-sm shadow-md cursor-pointer">
          GİRİŞ YAP
        </button>
      </form>

      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">E-POSTA ADRESİ</label>
          <input type="email" id="register-email" required class="w-full text-sm p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#002855] outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">ŞİFRE (EN AZ 6 KARAKTER)</label>
          <input type="password" id="register-password" required minlength="6" class="w-full text-sm p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#002855] outline-none transition-all">
        </div>
        <button type="submit" id="btn-register" class="w-full bg-[#002855] hover:bg-[#001d3d] text-[#FFCC00] font-bold p-3 rounded-lg transition-all text-sm shadow-md cursor-pointer">
          HESAP OLUŞTUR
        </button>
      </form>
      <div id="auth-error" class="text-xs text-red-600 font-semibold text-center hidden p-2 bg-red-50 rounded-lg border border-red-200"></div>
    </div>
  </div>

  <div id="app-container" class="hidden min-h-screen pb-12">
    <header class="bg-[#002855] text-white shadow-lg p-4 sticky top-0 z-30 border-b-4 border-[#FFCC00]">
      <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <div class="bg-[#FFCC00] text-[#002855] p-2.5 rounded-lg font-bold text-xl shadow">
            <i class="fa-solid fa-ship"></i>
          </div>
          <div>
            <h1 class="text-lg md:text-xl font-bold tracking-wide uppercase text-white">MSC & MEDLOG TAKİP</h1>
            <p class="text-xs text-yellow-300 font-medium">Operasyon & Gümrük İzleme</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="hidden md:flex items-center gap-2 bg-[#001d3d] px-3 py-1.5 rounded-lg border border-blue-900 text-xs">
            <i class="fa-solid fa-user-circle text-[#FFCC00]"></i>
            <span id="user-display-email" class="font-mono text-blue-200"></span>
          </div>
          <button type="button" onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition-all cursor-pointer flex items-center gap-1">
            <i class="fa-solid fa-right-from-bracket"></i> ÇIKIŞ
          </button>
        </div>

    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
      
      <div id="dashboard-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">Toplam Gemi</p>
            <h4 id="stat-total" class="text-xl font-bold text-[#002855]">0</h4>
          </div>
          <div class="bg-blue-50 text-[#002855] p-3 rounded-lg"><i class="fa-solid fa-ship"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">Normal / Seyirde</p>
            <h4 id="stat-normal" class="text-xl font-bold text-emerald-600">0</h4>
          </div>
          <div class="bg-emerald-50 text-emerald-600 p-3 rounded-lg"><i class="fa-solid fa-circle-check"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">Kritik (10s / 5s)</p>
            <h4 id="stat-critical" class="text-xl font-bold text-orange-600">0</h4>
          </div>
          <div class="bg-orange-50 text-orange-600 p-3 rounded-lg"><i class="fa-solid fa-triangle-exclamation"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase">Limana Vardı</p>
            <h4 id="stat-arrived" class="text-xl font-bold text-slate-800">0</h4>
          </div>
          <div class="bg-slate-100 text-slate-700 p-3 rounded-lg"><i class="fa-solid fa-anchor"></i></div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold mb-4 text-[#002855] flex items-center gap-2 border-b pb-2 uppercase">
          <i class="fa-solid fa-plus-circle text-[#FFCC00]"></i> YENİ GEMİ EKLE
        </h2>
        <form id="ship-form" onsubmit="addShip(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
          <div><label class="block text-xs font-bold text-slate-600 mb-1">GEMİ ADI</label><input type="text" id="shipName" required class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">SEFER NO</label><input type="text" id="voyageNumber" required class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">IMO NO</label><input type="text" id="imoNumber" class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">GELDİĞİ LİMAN</label><input type="text" id="originPort" required class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">VARIŞ LİMANI</label>
            <select id="destinationPort" required class="w-full text-sm p-2.5 border rounded-lg uppercase">
              <option value="İZMİR ALSANCAK">İZMİR ALSANCAK</option>
              <option value="ALİAĞA SOCAR">ALİAĞA SOCAR</option>
              <option value="MERSİN">MERSİN</option>
              <option value="TEKİRDAĞ">TEKİRDAĞ</option>
              <option value="GEMLİK">GEMLİK</option>
              <option value="AMBARLI">AMBARLI</option>
            </select>
          </div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">MAİL</label><input type="email" id="notificationEmail" required class="w-full text-sm p-2.5 border rounded-lg"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">ETA</label><input type="datetime-local" id="eta" required class="w-full text-sm p-2.5 border rounded-lg"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">BEYANNAME</label><input type="number" id="declarations" min="1" required class="w-full text-sm p-2.5 border rounded-lg"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">EK NOT</label><input type="text" id="shipNote" class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div class="flex items-end"><button type="submit" class="w-full bg-[#FFCC00] text-[#002855] font-bold p-2.5 rounded-lg flex justify-center items-center gap-2"><i class="fa-solid fa-check-circle"></i> EKLE</button></div>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
          <h3 class="font-bold text-[#002855] flex items-center gap-2 uppercase"><i class="fa-solid fa-list-check"></i> TAKİP EDİLENLER</h3>
          <select id="filterPort" onchange="renderShips()" class="text-xs p-2 border rounded-lg font-medium uppercase shadow-sm">
            <option value="ALL">TÜMÜ</option>
            <option value="İZMİR ALSANCAK">İZMİR ALSANCAK</option>
            <option value="ALİAĞA SOCAR">ALİAĞA SOCAR</option>
          </select>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-[11px] font-bold uppercase border-b">
                <th class="p-3">GEMİ / IMO</th>
                <th class="p-3">GÜZERGAH / NOT</th>
                <th class="p-3">ETA (VARIŞ)</th>
                <th class="p-3">KALAN SÜRE</th>
                <th class="p-3 text-right">İŞLEMLER</th>
              </tr>
            </thead>
            <tbody id="ship-list-body" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>

  <div id="editModal" class="fixed inset-0 bg-slate-900/80 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
      <div class="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl relative">
        <h3 class="font-bold text-lg text-slate-800 uppercase border-b pb-3"><i class="fa-solid fa-pen text-amber-500"></i> DÜZENLE</h3>
        <button onclick="document.getElementById('editModal').classList.add('hidden')" class="absolute top-4 right-6 text-slate-400 hover:text-red-600 text-2xl font-bold">&times;</button>
        <form id="edit-form" onsubmit="saveEdit(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input type="hidden" id="edit-id">
          <div class="sm:col-span-2"><label class="block text-xs font-bold text-slate-600 mb-1">GEMİ ADI</label><input type="text" id="edit-shipName" required class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">ETA</label><input type="datetime-local" id="edit-eta" required class="w-full text-sm p-2.5 border rounded-lg"></div>
          <div><label class="block text-xs font-bold text-slate-600 mb-1">NOT</label><input type="text" id="edit-note" class="w-full text-sm p-2.5 border rounded-lg uppercase"></div>
          <div class="sm:col-span-2"><button type="submit" class="w-full bg-[#FFCC00] font-bold p-3 rounded-lg text-sm">KAYDET</button></div>
        </form>
      </div>
  </div>

  <div id="action-buttons-container" class="hidden text-center my-8 flex justify-center gap-4 flex-wrap">
    <button type="button" id="btn-toplu-yukle" style="background-color: #28a745; color: white; padding: 15px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🚀 14 GEMİYİ YÜKLE</button>
    
    <label for="excel-file-input" style="background-color: #002855; color: #FFCC00; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-flex; align-items: center; gap: 8px;">
        <span id="excel-label-text">📁 ETA EXCEL YÜKLE (.XLSM)</span>
    </label>
    <input type="file" id="excel-file-input" accept=".xlsx, .xls, .xlsm, .csv" style="display: none;" onchange="handleDailyExcel(event)">
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAKAF1Tm0Ahy5kT3OW6Slc0sjTbiFvaifg", authDomain: "msc-takip.firebaseapp.com",
      projectId: "msc-takip", storageBucket: "msc-takip.firebasestorage.app",
      messagingSenderId: "688773853204", appId: "1:688773853204:web:77be98f1fb28d3e2b3b701"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    let currentUser = null, ships = [], unsubscribeFirestore = null;

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        document.getElementById('action-buttons-container').classList.remove('hidden');
        document.getElementById('action-buttons-container').style.display = 'flex';
        document.getElementById('user-display-email').innerText = user.email;
        if(unsubscribeFirestore) unsubscribeFirestore();
        unsubscribeFirestore = db.collection('ships').where('userId', '==', currentUser.uid).onSnapshot(snap => {
          ships = []; snap.forEach(doc => ships.push({ firestoreId: doc.id, ...doc.data() })); renderShips();
        });
      } else {
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('action-buttons-container').classList.add('hidden');
        document.getElementById('auth-container').classList.remove('hidden');
      }
    });

    function switchAuthTab(tab) {
      if (tab === 'login') { document.getElementById('login-form').classList.remove('hidden'); document.getElementById('register-form').classList.add('hidden'); } 
      else { document.getElementById('login-form').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); }
    }

    function handleLogin(e) { e.preventDefault(); auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value); }
    function handleLogout() { if(confirm("Çıkış yapmak istediğinize emin misiniz?")) auth.signOut(); }

    function addShip(e) { 
        e.preventDefault(); 
        const name = document.getElementById('shipName').value.trim().toUpperCase();
        const eta = document.getElementById('eta').value;
        const newShipData = {
            userId: currentUser.uid, name: name,
            voyage: document.getElementById('voyageNumber').value.trim().toUpperCase(),
            imo: document.getElementById('imoNumber').value.trim().toUpperCase() || 'BELİRTİLMEDİ',
            originPort: document.getElementById('originPort').value.trim().toUpperCase(),
            destinationPort: document.getElementById('destinationPort').value.toUpperCase(),
            eta: eta, declarations: parseInt(document.getElementById('declarations').value),
            note: document.getElementById('shipNote').value.trim().toUpperCase(),
            email: document.getElementById('notificationEmail').value.trim().toLowerCase(),
            status: 'PENDING', emailSentNew: false, emailSent10h: false, emailSent5h: false, emailSentArrived: false,
            createdAt: new Date().toISOString()
        };
        db.collection('ships').add(newShipData).then(() => {
            document.getElementById('ship-form').reset();
            alert("✅ Kayıt başarıyla eklendi!");
        });
    }

    function deleteShip(id) { if(confirm("Silmek istediğinize emin misiniz?")) db.collection('ships').doc(id).delete(); }
    function completeShip(id) { db.collection('ships').doc(id).update({ status: 'COMPLETED' }); }

    function renderShips() {
      const tbody = document.getElementById('ship-list-body');
      const filterPort = document.getElementById('filterPort').value;
      const filtered = filterPort === 'ALL' ? ships : ships.filter(s => s.destinationPort === filterPort);
      
      let tot = filtered.length, nrm = 0, crit = 0, arr = 0;
      tbody.innerHTML = '';
      
      filtered.sort((a, b) => new Date(a.eta) - new Date(b.eta)).forEach(ship => {
        const diffHours = (new Date(ship.eta) - new Date()) / (1000 * 60 * 60);
        let bClass = 'bg-emerald-100 text-emerald-700', bText = '🟢 NORMAL';
        
        if (ship.status === 'COMPLETED') { bClass = 'bg-slate-100 text-slate-600'; bText = 'TAMAMLANDI'; }
        else if (diffHours <= 0) { bClass = 'bg-slate-800 text-white'; bText = '⚓ LİMANA VARDI'; arr++; }
        else if (diffHours <= 10) { bClass = 'bg-orange-100 text-orange-700'; bText = '🟠 KRİTİK'; crit++; }
        else { nrm++; }

        tbody.innerHTML += `
          <tr class="border-b hover:bg-slate-50">
            <td class="p-3 font-bold">${ship.name}<br><span class="text-[10px] text-gray-500">IMO: ${ship.imo || '-'}</span></td>
            <td class="p-3 text-xs">${ship.originPort} > ${ship.destinationPort}<br><span class="text-amber-600 font-bold">${ship.note || ''}</span></td>
            <td class="p-3 text-xs font-medium">${new Date(ship.eta).toLocaleString('tr-TR')}</td>
            <td class="p-3 text-xs font-bold"><span class="px-2 py-1 rounded ${bClass}">${bText}</span></td>
            <td class="p-3 text-right">
              ${ship.status !== 'COMPLETED' ? `<button onclick="completeShip('${ship.firestoreId}')" class="text-emerald-600 bg-emerald-50 p-2 rounded-lg border border-emerald-200 shadow-sm"><i class="fa-solid fa-check"></i></button>` : ''}
              <button onclick="deleteShip('${ship.firestoreId}')" class="text-red-600 bg-red-50 p-2 rounded-lg border border-red-200 shadow-sm"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
      });
      document.getElementById('stat-total').innerText = tot;
      document.getElementById('stat-normal').innerText = nrm;
      document.getElementById('stat-critical').innerText = crit;
      document.getElementById('stat-arrived').innerText = arr;
    }

    // YENİ AKILLI TARİH ÇÖZÜCÜ
    function parseCustomDate(dateStr) {
        if (!dateStr) return null;
        let str = dateStr.toString().trim();
        let parts = str.split(/[\sT]+/); 
        let datePart = parts[0];
        let timePart = parts[1] || "00:00";
        let dParts = datePart.split(/[\.\/\-]/);
        if (dParts.length === 3) {
            let p1 = parseInt(dParts[0]), p2 = parseInt(dParts[1]), p3 = parseInt(dParts[2]);
            let day = p1 > 12 ? p1 : (p2 > 12 ? p2 : p1); 
            let month = p1 > 12 ? p2 - 1 : (p2 > 12 ? p1 - 1 : p2 - 1); 
            let year = p3 < 100 ? p3 + 2000 : p3;
            let tParts = timePart.split(":");
            return new Date(year, month, day, parseInt(tParts[0]) || 0, parseInt(tParts[1]) || 0);
        }
        let d = new Date(str);
        return isNaN(d.getTime()) ? null : d;
    }

    // KUSURSUZ EXCEL YÜKLEME VE OKUMA
    function handleDailyExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const btnLabel = document.getElementById('excel-label-text');
        btnLabel.innerText = "⏳ EXCEL OKUNUYOR...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                const currentMonthNames = ["OCAK", "ŞUBAT", "MART", "NİSAN", "MAYIS", "HAZİRAN", "TEMMUZ", "AĞUSTOS", "EYLÜL", "EKİM", "KASIM", "ARALIK"];
                const currMonth = currentMonthNames[new Date().getMonth()];
                const altMonth = currMonth.replace(/Ğ/g, 'G').replace(/Ü/g, 'U').replace(/Ş/g, 'S').replace(/İ/g, 'I').replace(/Ö/g, 'O').replace(/Ç/g, 'C');
                
                let targetSheet = workbook.SheetNames.find(s => s.toUpperCase().includes(currMonth) || s.toUpperCase().includes(altMonth)) || workbook.SheetNames[0];
                
                // Tabloyu bulmak için düz dizi olarak çekiyoruz
                const aoa = XLSX.utils.sheet_to_json(workbook.Sheets[targetSheet], {header: 1, raw: false, defval: ""});

                let nameIdx = -1, etaIdx = -1, etbIdx = -1, startRow = -1;

                // RADAR: İlk 20 satırı tarayıp tablonun gerçek başlıklarını bul
                for (let i = 0; i < Math.min(aoa.length, 20); i++) {
                    const row = aoa[i];
                    if (!row || row.length === 0) continue;
                    
                    for (let j = 0; j < row.length; j++) {
                        let val = (row[j] || '').toString().toUpperCase().trim();
                        if (val.includes('GEMİ ADI') || val.includes('GEMI ADI') || val.includes('VESSEL')) nameIdx = j;
                        if (val === 'ETA' || val.includes('TAHMİNİ VARIŞ') || val.includes('VARIS')) etaIdx = j;
                        if (val === 'ETB' || val.includes('TAHMİNİ YANAŞMA') || val.includes('YANASMA')) etbIdx = j;
                    }
                    if (nameIdx !== -1 && etaIdx !== -1) {
                        startRow = i + 1; // Veriler bu başlıktan hemen sonraki satırda başlar
                        break;
                    }
                }

                if (startRow === -1) throw new Error("Excel'de 'GEMİ ADI' ve 'ETA' sütunları bulunamadı!");

                let futureRuns = {};
                const rightNow = new Date();
                rightNow.setHours(0,0,0,0); // Gece 00:00 baz alınır (Bugün ve sonrası)

                for (let i = startRow; i < aoa.length; i++) {
                    const row = aoa[i];
                    if (!row || !row[nameIdx]) continue;

                    const excelName = row[nameIdx].toString().trim().toUpperCase();
                    const rawEta = row[etaIdx] ? row[etaIdx].toString().trim() : '';
                    const rawEtb = (etbIdx !== -1 && row[etbIdx]) ? row[etbIdx].toString().trim() : '';
                    
                    if (!excelName || !rawEta) continue;

                    const etaDateObj = parseCustomDate(rawEta);
                    
                    // Geçmiş Kırmızı Tarihleri Eleme Filtresi
                    if (etaDateObj && etaDateObj >= rightNow) {
                        if (!futureRuns[excelName]) futureRuns[excelName] = [];
                        futureRuns[excelName].push({ name: excelName, etaStr: rawEta, dateObj: etaDateObj, etbStr: rawEtb });
                    }
                }

                let updatedCount = 0;

                // Shuttle (Aynı geminin birden çok seferi) kontrolü ve Güncelleme
                for (const [shipName, runs] of Object.entries(futureRuns)) {
                    runs.sort((a, b) => a.dateObj - b.dateObj); // En yakın tarihi en başa al
                    const closestRun = runs[0]; 

                    const matchedShip = ships.find(s => (s.name || '').toUpperCase() === shipName);
                    
                    if (matchedShip) {
                        let noteStr = closestRun.etbStr ? `ETB: ${closestRun.etbStr}` : 'EXCEL GÜNCEL';
                        await db.collection('ships').doc(matchedShip.firestoreId).update({
                            eta: closestRun.dateObj.toISOString().slice(0,16), 
                            note: noteStr,
                            emailSent10h: false, emailSent5h: false, emailSentArrived: false
                        });
                        updatedCount++;
                    }
                }
                alert(`✅ İŞLEM BAŞARILI!\n📄 Okunan Sayfa: ${targetSheet}\n🚢 Güncellenen Gemi: ${updatedCount}`);
            } catch (err) {
                console.error("HATA:", err);
                alert("❌ Yükleme Hatası: " + err.message);
            }
            
            btnLabel.innerText = "📁 ETA EXCEL YÜKLE (.XLSM)";
            event.target.value = ''; 
        };
        reader.readAsArrayBuffer(file);
    }
