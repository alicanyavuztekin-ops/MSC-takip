<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MSC & MEDLOG Gemi ve Operasyon Paneli</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-active { background-color: #111111; color: #FFCC00; border-color: #111111; }
    .tab-inactive { background-color: #f8fafc; color: #64748b; border-color: #e2e8f0; }
    .view-btn-active { background-color: #FFCC00; color: #111111; border-color: #FFCC00; }
    .view-btn-inactive { background-color: white; color: #64748b; border-color: #e2e8f0; }
    /* Kanban Sütun Tasarımları */
    .kanban-col { min-height: 400px; border-radius: 12px; padding: 12px; }
    .col-normal { background-color: #f0fdf4; border-top: 4px solid #22c55e; }
    .col-12h { background-color: #fff7ed; border-top: 4px solid #f97316; }
    .col-6h { background-color: #fef2f2; border-top: 4px solid #ef4444; }
    .col-arrived { background-color: #f1f5f9; border-top: 4px solid #334155; }
  </style>
</head>
<body class="bg-zinc-100 font-sans text-slate-800 antialiased min-h-screen">

  <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full space-y-6 border border-slate-200">
      <div class="text-center space-y-2">
        <div class="bg-[#111111] text-[#FFCC00] w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold shadow-md">
          <i class="fa-solid fa-ship"></i>
        </div>
        <h2 class="text-2xl font-bold text-[#111111] uppercase">MSC & MEDLOG TAKİP</h2>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div><input type="email" id="login-email" placeholder="E-Posta" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-black outline-none"></div>
        <div><input type="password" id="login-password" placeholder="Şifre" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-black outline-none"></div>
        <button type="submit" class="w-full bg-[#111111] hover:bg-black text-[#FFCC00] font-bold p-3 rounded-lg shadow-md cursor-pointer transition-colors">GİRİŞ YAP</button>
      </form>
    </div>
  </div>

  <div id="app-container" class="hidden min-h-screen pb-12">
    <header class="bg-[#111111] text-white shadow-lg p-4 sticky top-0 z-30 border-b-4 border-[#FFCC00]">
      <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <div class="bg-[#FFCC00] text-[#111111] p-2.5 rounded-lg font-bold text-xl"><i class="fa-solid fa-ship"></i></div>
          <div><h1 class="text-lg md:text-xl font-bold uppercase text-white">MSC & MEDLOG TAKİP</h1></div>
        </div>
        <div class="flex items-center gap-3">
          <span id="user-display-email" class="hidden md:block text-zinc-300 text-xs"></span>
          <button type="button" onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i> ÇIKIŞ</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between"><div class="font-bold"><p class="text-xs text-slate-400">Aktif Gemi</p><h4 id="stat-total" class="text-xl text-[#111111]">0</h4></div><div class="bg-zinc-100 text-[#111111] p-3 rounded-lg"><i class="fa-solid fa-ship"></i></div></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between"><div class="font-bold"><p class="text-xs text-slate-400">Seyirde</p><h4 id="stat-normal" class="text-xl text-emerald-600">0</h4></div><div class="bg-emerald-50 text-emerald-600 p-3 rounded-lg"><i class="fa-solid fa-circle-check"></i></div></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between"><div class="font-bold"><p class="text-xs text-slate-400">Kritik (12s/6s)</p><h4 id="stat-critical" class="text-xl text-orange-600">0</h4></div><div class="bg-orange-50 text-orange-600 p-3 rounded-lg"><i class="fa-solid fa-triangle-exclamation"></i></div></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between"><div class="font-bold"><p class="text-xs text-slate-400">Yanaştı</p><h4 id="stat-arrived" class="text-xl text-slate-800">0</h4></div><div class="bg-slate-100 text-slate-700 p-3 rounded-lg"><i class="fa-solid fa-anchor"></i></div></div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border">
        <h2 class="text-base font-bold mb-4 text-[#111111] flex items-center gap-2 border-b pb-2"><i class="fa-solid fa-plus-circle text-[#FFCC00]"></i> YENİ GEMİ EKLE</h2>
        <form id="ship-form" onsubmit="addShip(event)" class="grid grid-cols-2 lg:grid-cols-5 gap-4">
          <div><label class="block text-xs font-bold mb-1">GEMİ ADI</label><input type="text" id="shipName" required class="w-full text-sm p-2 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold mb-1">IMO NO</label><input type="text" id="imoNumber" class="w-full text-sm p-2 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold mb-1">GELDİĞİ LİMAN</label><input type="text" id="originPort" required class="w-full text-sm p-2 border rounded-lg uppercase"></div>
          <div><label class="block text-xs font-bold mb-1">VARIŞ LİMANI</label><select id="destinationPort" required class="w-full text-sm p-2 border rounded-lg"><option value="İZMİR ALSANCAK">İZMİR ALSANCAK</option><option value="ALİAĞA SOCAR">ALİAĞA SOCAR</option></select></div>
          <div><label class="block text-xs font-bold mb-1">HEDEF ZAMAN</label><input type="datetime-local" id="eta" required class="w-full text-sm p-2 border rounded-lg"></div>
          <div class="col-span-2 lg:col-span-1 flex items-end"><button type="submit" class="w-full bg-[#FFCC00] text-[#111111] font-bold p-2.5 rounded-lg shadow-md hover:bg-yellow-500"><i class="fa-solid fa-check-circle"></i> EKLE</button></div>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
        
        <div class="p-3 bg-slate-50 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="setTab('ACTIVE')" id="tab-active" class="tab-active flex-1 py-2 px-4 rounded-lg font-bold text-sm shadow-sm transition-all uppercase flex items-center justify-center gap-2"><i class="fa-solid fa-satellite-dish"></i> AKTİF</button>
                <button onclick="setTab('ARCHIVE')" id="tab-archive" class="tab-inactive flex-1 py-2 px-4 rounded-lg font-bold text-sm shadow-sm border transition-all uppercase flex items-center justify-center gap-2"><i class="fa-solid fa-box-archive"></i> ARŞİV</button>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between">
                <div class="flex bg-slate-200 p-1 rounded-lg">
                    <button onclick="setViewMode('LIST')" id="btn-view-list" class="view-btn-active px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1 transition-colors"><i class="fa-solid fa-list"></i> LİSTE</button>
                    <button onclick="setViewMode('BOARD')" id="btn-view-board" class="view-btn-inactive px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1 transition-colors"><i class="fa-brands fa-trello"></i> PANO</button>
                </div>
                <select id="filterPort" onchange="renderShips()" class="text-xs p-2 border rounded-lg font-medium shadow-sm"><option value="ALL">TÜM LİMANLAR</option><option value="İZMİR ALSANCAK">İZMİR ALSANCAK</option><option value="ALİAĞA SOCAR">ALİAĞA SOCAR</option></select>
            </div>
        </div>

        <div id="view-list" class="overflow-x-auto block">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead><tr class="bg-zinc-100 text-slate-600 text-[11px] font-bold border-b"><th class="p-3">GEMİ / IMO</th><th class="p-3">GÜZERGAH / NOT</th><th class="p-3">HEDEF ZAMAN</th><th class="p-3">DURUM SÜRESİ</th><th class="p-3 text-right">İŞLEMLER</th></tr></thead>
            <tbody id="ship-list-body" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>

        <div id="view-board" class="hidden p-4 bg-slate-50">
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                <div class="kanban-col col-normal">
                    <h3 class="text-sm font-bold text-emerald-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-water"></i> SEYİRDE <span id="kb-count-normal" class="ml-auto bg-emerald-200 px-2 py-0.5 rounded-full text-xs">0</span></h3>
                    <div id="kb-normal" class="space-y-3"></div>
                </div>
                <div class="kanban-col col-12h">
                    <h3 class="text-sm font-bold text-orange-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-clock"></i> 12 SAAT KALA <span id="kb-count-12h" class="ml-auto bg-orange-200 px-2 py-0.5 rounded-full text-xs">0</span></h3>
                    <div id="kb-12h" class="space-y-3"></div>
                </div>
                <div class="kanban-col col-6h">
                    <h3 class="text-sm font-bold text-red-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> 6 SAAT KALA <span id="kb-count-6h" class="ml-auto bg-red-200 px-2 py-0.5 rounded-full text-xs">0</span></h3>
                    <div id="kb-6h" class="space-y-3"></div>
                </div>
                <div class="kanban-col col-arrived">
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-anchor"></i> LİMANDA / ARŞİV <span id="kb-count-arrived" class="ml-auto bg-slate-200 px-2 py-0.5 rounded-full text-xs">0</span></h3>
                    <div id="kb-arrived" class="space-y-3"></div>
                </div>
            </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAKAF1Tm0Ahy5kT3OW6Slc0sjTbiFvaifg", authDomain: "msc-takip.firebaseapp.com",
      projectId: "msc-takip", storageBucket: "msc-takip.firebasestorage.app",
      messagingSenderId: "688773853204", appId: "1:688773853204:web:77be98f1fb28d3e2b3b701"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.firestore();
    
    let currentUser = null, ships = [];
    let currentViewTab = 'ACTIVE';
    let currentDisplayMode = 'LIST'; // LIST veya BOARD

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        db.collection('ships').where('userId', '==', currentUser.uid).onSnapshot(snap => {
          ships = []; snap.forEach(doc => ships.push({ firestoreId: doc.id, ...doc.data() })); renderShips();
        });
      }
    });

    function handleLogin(e) { e.preventDefault(); auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value); }
    function handleLogout() { auth.signOut(); location.reload(); }

    function setTab(tabName) { currentViewTab = tabName; renderShips(); }
    
    // Görünüm Değiştirici (Liste <-> Pano)
    function setViewMode(mode) {
        currentDisplayMode = mode;
        if(mode === 'LIST') {
            document.getElementById('view-list').classList.remove('hidden');
            document.getElementById('view-board').classList.add('hidden');
            document.getElementById('btn-view-list').className = "view-btn-active px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1";
            document.getElementById('btn-view-board').className = "view-btn-inactive border px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1";
        } else {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-board').classList.remove('hidden');
            document.getElementById('btn-view-board').className = "view-btn-active px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1";
            document.getElementById('btn-view-list').className = "view-btn-inactive border px-3 py-1.5 rounded-md text-xs font-bold flex items-center gap-1";
        }
    }

    function addShip(e) { e.preventDefault(); /* Eski ekleme mantığı aynı */ }
    function completeShip(id) { if(confirm("Arşive aktarılacak.")) db.collection('ships').doc(id).update({ status: 'COMPLETED' }); }
    function deleteShip(id) { if(confirm("Silmek istediğinize emin misiniz?")) db.collection('ships').doc(id).delete(); }

    // Gemi Rotasını Haritada Gösterme (VesselFinder IMO Linki)
    function openRadar(imo) {
        if(!imo || imo === '-' || imo === 'BELİRTİLMEDİ') { alert("Bu geminin IMO numarası girilmediği için haritada gösterilemiyor."); return; }
        window.open(`https://www.vesselfinder.com/vessels/details/${imo}`, '_blank');
    }

    function renderShips() {
      const tbody = document.getElementById('ship-list-body');
      
      // Kanban Sütunları
      const kbNormal = document.getElementById('kb-normal'); const kb12h = document.getElementById('kb-12h');
      const kb6h = document.getElementById('kb-6h'); const kbArrived = document.getElementById('kb-arrived');
      kbNormal.innerHTML = ''; kb12h.innerHTML = ''; kb6h.innerHTML = ''; kbArrived.innerHTML = '';
      let cN = 0, c12 = 0, c6 = 0, cA = 0;

      const filterPort = document.getElementById('filterPort').value;
      let filtered = ships.filter(s => currentViewTab === 'ACTIVE' ? s.status !== 'COMPLETED' : s.status === 'COMPLETED');
      if(filterPort !== 'ALL') filtered = filtered.filter(s => s.destinationPort === filterPort);
      
      let tot = 0, nrm = 0, crit = 0, arr = 0;
      ships.filter(s => s.status !== 'COMPLETED').forEach(s => {
          const dh = (new Date(s.eta) - new Date()) / 3600000;
          if (dh <= 0) arr++; else if (dh <= 12) crit++; else nrm++; tot++;
      });

      tbody.innerHTML = '';
      
      filtered.sort((a, b) => new Date(a.eta) - new Date(b.eta)).forEach(ship => {
        const diffHours = (new Date(ship.eta) - new Date()) / 3600000;
        
        let bClass = 'bg-blue-100 text-blue-700', bText = '🟢 SEYİRDE';
        let progressWidth = '40%'; let progressColor = 'bg-blue-500';
        let targetCol = kbNormal;
        
        if (ship.status === 'COMPLETED') { 
            bClass = 'bg-slate-100 text-slate-600'; bText = 'ARŞİVLENDİ'; progressWidth = '100%'; targetCol = kbArrived; cA++;
        } else if (diffHours <= 0) { 
            bClass = 'bg-slate-800 text-white'; bText = '⚓ YANAŞTI'; progressWidth = '100%'; progressColor = 'bg-emerald-500'; targetCol = kbArrived; cA++;
        } else if (diffHours <= 6) { 
            bClass = 'bg-red-100 text-red-700 animate-pulse'; bText = '🔴 6 SAAT KALA'; progressWidth = '90%'; progressColor = 'bg-red-600'; targetCol = kb6h; c6++;
        } else if (diffHours <= 12) { 
            bClass = 'bg-orange-100 text-orange-700'; bText = '🟠 12 SAAT KALA'; progressWidth = '75%'; progressColor = 'bg-orange-500'; targetCol = kb12h; c12++;
        } else { cN++; }

        let avatarBg = ship.name.includes("MED") ? "bg-[#FFCC00] text-[#111111]" : "bg-[#111111] text-[#FFCC00]";
        let avatarText = ship.name.includes("MED") ? "MD" : "MS";

        // --- LİSTE GÖRÜNÜMÜ SATIRI ---
        tbody.innerHTML += `
          <tr class="border-b hover:bg-zinc-50">
            <td class="p-3"><div class="flex items-center gap-3"><div class="${avatarBg} w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs">${avatarText}</div><div><div class="font-bold text-sm">${ship.name}</div><div class="text-[10px] text-gray-500">IMO: ${ship.imo || '-'}</div></div></div></td>
            <td class="p-3 text-xs"><b>${ship.destinationPort}</b></td>
            <td class="p-3 text-xs font-medium">${new Date(ship.eta).toLocaleString('tr-TR')}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${bClass}">${bText}</span></td>
            <td class="p-3 text-right">
                <button onclick="openRadar('${ship.imo}')" class="text-blue-600 bg-blue-50 px-2 py-1.5 rounded-lg border text-xs font-bold mr-1 hover:bg-blue-100"><i class="fa-solid fa-location-dot"></i> RADAR</button>
                ${ship.status !== 'COMPLETED' ? `<button onclick="completeShip('${ship.firestoreId}')" class="text-emerald-600 bg-emerald-50 w-8 h-8 rounded-lg border"><i class="fa-solid fa-check"></i></button>` : ''}
            </td>
          </tr>`;

        // --- KANBAN KART GÖRÜNÜMÜ ---
        targetCol.innerHTML += `
          <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 hover:shadow-md transition-shadow relative">
             <div class="flex justify-between items-start mb-2">
                <div class="font-bold text-[#111111] text-sm">${ship.name}</div>
                <button onclick="openRadar('${ship.imo}')" class="text-blue-500 hover:text-blue-700" title="Haritada Gör"><i class="fa-solid fa-map-location-dot"></i></button>
             </div>
             <div class="text-[11px] text-slate-500 mb-2"><i class="fa-solid fa-anchor"></i> ${ship.destinationPort}</div>
             <div class="bg-slate-50 p-1.5 rounded border text-xs font-bold text-center mb-3">${new Date(ship.eta).toLocaleString('tr-TR')}</div>
             <div class="w-full bg-slate-200 rounded-full h-1.5 mb-2"><div class="${progressColor} h-1.5 rounded-full" style="width: ${progressWidth}"></div></div>
             <div class="flex justify-between items-center mt-2 pt-2 border-t border-dashed">
                <span class="text-[9px] font-bold ${bClass} px-1.5 py-0.5 rounded">${bText}</span>
                ${ship.status !== 'COMPLETED' ? `<button onclick="completeShip('${ship.firestoreId}')" class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-1 rounded font-bold hover:bg-emerald-100">TAMAMLA</button>` : ''}
             </div>
          </div>
        `;
      });
      
      document.getElementById('stat-total').innerText = tot; document.getElementById('stat-normal').innerText = nrm;
      document.getElementById('stat-critical').innerText = crit; document.getElementById('stat-arrived').innerText = arr;
      document.getElementById('kb-count-normal').innerText = cN; document.getElementById('kb-count-12h').innerText = c12;
      document.getElementById('kb-count-6h').innerText = c6; document.getElementById('kb-count-arrived').innerText = cA;
    }
  </script>
</body>
</html>
