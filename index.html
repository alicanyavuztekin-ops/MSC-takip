### Dashboard'u Çalışır Hale Getirmek İçin
Dosyanın altındaki `<script>` bloğunda bulunan **`renderShips()`** fonksiyonunun içerisine, verileri sayıp bu kutucuklara yazdıracak şu küçük sayaç mantığını ekleyebiliriz:

```javascript
      // Dashboard İstatistik Hesaplamaları
      let totalCount = filteredShips.length;
      let normalCount = 0;
      let criticalCount = 0;
      let arrivedCount = 0;

      filteredShips.forEach(ship => {
        const time = calculateTimeRemaining(ship.eta);
        if (ship.status === 'COMPLETED') return;
        
        if (time.totalHours <= 0) {
          arrivedCount++;
        } else if (time.totalHours <= 10) {
          criticalCount++;
        } else {
          normalCount++;
        }
      });

      // HTML Alanlarına Verileri Basma
      document.getElementById('stat-total').innerText = totalCount;
      document.getElementById('stat-normal').innerText = normalCount;
      document.getElementById('stat-critical').innerText = criticalCount;
      document.getElementById('stat-arrived').innerText = arrivedCount;
