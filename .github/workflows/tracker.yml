name: MSC Master Clock Otomasyonu

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run-master-clock:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Node.js Kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Kütüphaneleri Yükle
        run: npm install nodemailer firebase-admin

      - name: Kontrol Kodunu Çalıştır
        env:
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: node check-ships.js
