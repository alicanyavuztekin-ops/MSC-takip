name: Tam Otonom ETA Botu ve Alarm Sistemi

on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch:

jobs:
  operasyon-botu:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install pandas openpyxl requests

      - name: Otonom Bot Kodunu Çalıştır
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          PANEL_EMAIL: ${{ secrets.PANEL_EMAIL }}
          PANEL_SIFRE: ${{ secrets.PANEL_SIFRE }}
        run: |
          cat << 'EOF' > bot.py
          import os, sys, datetime, imaplib, email, requests, smtplib
          import pandas as pd
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          BOT_EMAIL = os.environ.get('BOT_EMAIL')
          BOT_PASSWORD = os.environ.get('BOT_PASSWORD')
          PANEL_EMAIL = os.environ.get('PANEL_EMAIL')
          PANEL_SIFRE = os.environ.get('PANEL_SIFRE')

          def send_alert_email(to_addr, ship_name, status_msg, eta_str, note_str):
              if not to_addr: return
              subject = f"MSC OPERASYON: {ship_name} - {status_msg}"
              body = f"""
              <html><body style="font-family: Arial, sans-serif; color: #333;">
              <h2 style='color:#002855; border-bottom: 2px solid #FFCC00; padding-bottom: 5px;'>LİMAN OPERASYON UYARISI</h2>
              <p><b>Gemi Adı:</b> <span style="font-size: 16px;">{ship_name}</span></p>
              <p><b>Durum:</b> <span style='color:red; font-size: 18px; font-weight: bold;'>{status_msg}</span></p>
              <p><b>Hedef Zaman (ETA/ETB):</b> {eta_str}</p>
              <p><b>Ek Not:</b> {note_str}</p>
              <br><hr style="border: 1px solid #eee;">
              <p><small style="color: #888;">Bu uyarı maili otomatik gonderilmistir.</small></p>
              </body></html>
              """
              try:
                  msg = MIMEMultipart()
                  msg['From'] = BOT_EMAIL
                  msg['To'] = to_addr
                  msg['Subject'] = subject
                  msg.attach(MIMEText(body, 'html'))
                  server = smtplib.SMTP('smtp.gmail.com', 587)
                  server.starttls()
                  server.login(BOT_EMAIL, BOT_PASSWORD)
                  server.send_message(msg)
                  server.quit()
              except Exception as e:
                  print(f"Mail gonderme hatasi: {e}")

          API_KEY = 'AIzaSyAKAF1Tm0Ahy5kT3OW6Slc0sjTbiFvaifg'
          auth_url = f'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={API_KEY}'
          r_auth = requests.post(auth_url, json={'email': PANEL_EMAIL, 'password': PANEL_SIFRE, 'returnSecureToken': True}).json()
          
          if 'idToken' not in r_auth:
              print('Kimlik Hatasi:', r_auth)
              sys.exit(1)

          id_token = r_auth['idToken']
          local_id = r_auth['localId']
          headers = {'Authorization': f'Bearer {id_token}'}

          db_url = 'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships'
          query = {
              'structuredQuery': {
                  'from': [{'collectionId': 'ships'}],
                  'where': {
                      'fieldFilter': {
                          'field': {'fieldPath': 'userId'},
                          'op': 'EQUAL',
                          'value': {'stringValue': local_id}
                      }
                  }
              }
          }
          r_docs = requests.post(db_url + ':runQuery', json=query, headers=headers).json()

          ships = []
          for d in r_docs:
              if 'document' in d:
                  doc = d['document']
                  doc_id = doc['name'].split('/')[-1]
                  ships.append({'id': doc_id, 'fields': doc.get('fields', {})})

          now_tr = datetime.datetime.utcnow() + datetime.timedelta(hours=3)
          now_tr_str = now_tr.strftime('%d.%m.%Y %H:%M')

          # === GÖREV 1: ALARMLARI AT ===
          for s in ships:
              fields = s['fields']
              status = fields.get('status', {}).get('stringValue', '')
              if status == 'COMPLETED': continue 
              
              eta_str = fields.get('eta', {}).get('stringValue', '')
              if not eta_str: continue
              
              try: ship_eta = datetime.datetime.strptime(eta_str, '%Y-%m-%dT%H:%M')
              except: continue
                  
              diff_hours = (ship_eta - now_tr).total_seconds() / 3600
              
              s_name = fields.get('name', {}).get('stringValue', '')
              s_email = fields.get('email', {}).get('stringValue', '')
              s_note = fields.get('note', {}).get('stringValue', '')
              
              sent12 = fields.get('emailSent12h', {}).get('booleanValue', False)
              sent6 = fields.get('emailSent6h', {}).get('booleanValue', False)
              sentArr = fields.get('emailSentArrived', {}).get('booleanValue', False)
              
              update_flags = {}
              alert_msg = ""
              
              if diff_hours <= 0 and not sentArr:
                  alert_msg = "LİMANA YANAŞTI (0 SAAT)"
                  update_flags = {'emailSentArrived': True, 'emailSent6h': True, 'emailSent12h': True}
              elif 0 < diff_hours <= 6 and not sent6:
                  alert_msg = "6 SAAT KALDI (KRİTİK UYARI)"
                  update_flags = {'emailSent6h': True, 'emailSent12h': True}
              elif 6 < diff_hours <= 12 and not sent12:
                  alert_msg = "12 SAAT KALDI (YAKLAŞIYOR)"
                  update_flags = {'emailSent12h': True}
                  
              if alert_msg:
                  send_alert_email(s_email, s_name, alert_msg, ship_eta.strftime('%d.%m.%Y %H:%M'), s_note)
                  upd_url = f'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships/{s["id"]}?'
                  paths = [f'updateMask.fieldPaths={k}' for k in update_flags.keys()]
                  upd_url += '&'.join(paths)
                  f_upd = {k: {'booleanValue': v} for k, v in update_flags.items()}
                  requests.patch(upd_url, json={'fields': f_upd}, headers=headers)

          # === GÖREV 2: EXCEL BOTU (YENİ SEFER MANTIĞI) ===
          active_ships = {s['fields'].get('name', {}).get('stringValue', '').upper(): s for s in ships if s['fields'].get('status', {}).get('stringValue', '') != 'COMPLETED'}
          archive_ships = {s['fields'].get('name', {}).get('stringValue', '').upper(): s for s in ships if s['fields'].get('status', {}).get('stringValue', '') == 'COMPLETED'}

          try:
              mail = imaplib.IMAP4_SSL('imap.gmail.com')
              mail.login(BOT_EMAIL, BOT_PASSWORD)
              mail.select('inbox')
              status, messages = mail.search(None, '(UNSEEN)')
              mail_ids = messages[0].split()
          except Exception:
              sys.exit(0)

          if not mail_ids: sys.exit(0)

          aylar = ['OCAK', 'ŞUBAT', 'MART', 'NİSAN', 'MAYIS', 'HAZİRAN', 'TEMMUZ', 'AĞUSTOS', 'EYLÜL', 'EKİM', 'KASIM', 'ARALIK']
          curr_month = aylar[now_tr.month - 1]
          alt_month = curr_month.replace('Ğ','G').replace('Ü','U').replace('Ş','S').replace('İ','I').replace('Ö','O').replace('Ç','C')

          for m_id in mail_ids:
              status, msg_data = mail.fetch(m_id, '(RFC822)')
              msg = email.message_from_bytes(msg_data[0][1])
              
              for part in msg.walk():
                  if part.get_content_maintype() == 'multipart' or part.get('Content-Disposition') is None: continue
                  filename = part.get_filename()
                  if filename and (filename.endswith('.xlsx') or filename.endswith('.xlsm')):
                      with open(filename, 'wb') as f: f.write(part.get_payload(decode=True))
                      
                      try:
                          xls = pd.ExcelFile(filename)
                          target_sheet = xls.sheet_names[0]
                          for s_name in xls.sheet_names:
                              if curr_month in s_name.upper() or alt_month in s_name.upper():
                                  target_sheet = s_name
                                  break
                          
                          df = pd.read_excel(xls, sheet_name=target_sheet, header=None)
                          name_idx, eta_idx, etb_idx, start_row = -1, -1, -1, -1
                          
                          for i in range(min(len(df), 20)):
                              row = df.iloc[i].fillna('').astype(str).str.upper().str.strip()
                              for j, val in enumerate(row):
                                  if 'GEMİ ADI' in val or 'VESSEL' in val: name_idx = j
                                  if val == 'ETA' or 'VARIS' in val: eta_idx = j
                                  if val == 'ETB' or 'YANASMA' in val: etb_idx = j
                              if name_idx != -1 and eta_idx != -1:
                                  start_row = i + 1
                                  break
                          
                          if start_row == -1: continue
                          
                          future_runs = {}
                          today_start = now_tr.replace(hour=0, minute=0, second=0, microsecond=0)
                          
                          for i in range(start_row, len(df)):
                              row = df.iloc[i]
                              if pd.isna(row.iloc[name_idx]): continue
                              excel_name = str(row.iloc[name_idx]).strip().upper()
                              raw_eta, raw_etb = row.iloc[eta_idx] if eta_idx != -1 else None, row.iloc[etb_idx] if etb_idx != -1 else None
                              if not excel_name or pd.isna(raw_eta): continue
                              
                              def parse_d(val):
                                  if pd.isna(val): return None
                                  if isinstance(val, datetime.datetime): return val
                                  try: return pd.to_datetime(val, dayfirst=True)
                                  except: return None
                              
                              eta_date, etb_date = parse_d(raw_eta), parse_d(raw_etb)
                              target_date = etb_date if (etb_date and not pd.isna(etb_date)) else eta_date
                              
                              if target_date and not pd.isna(target_date) and target_date >= today_start:
                                  if excel_name not in future_runs: future_runs[excel_name] = []
                                  future_runs[excel_name].append({'target_date': target_date, 'etb_str': etb_date.strftime('%d.%m.%Y %H:%M') if (etb_date and not pd.isna(etb_date)) else ''})
                          
                          for s_name_ex, runs in future_runs.items():
                              runs.sort(key=lambda x: x['target_date'])
                              closest = runs[0]
                              note_str = f'ETB BAZ ALINDI ({closest["etb_str"]})' if closest['etb_str'] else 'ETA BAZ ALINDI (BOT)'
                              new_eta_str = closest['target_date'].strftime('%Y-%m-%dT%H:%M')

                              if s_name_ex in active_ships:
                                  # Aktif gemiyi guncelle
                                  matched_id = active_ships[s_name_ex]['id']
                                  upd_url = f'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships/{matched_id}?updateMask.fieldPaths=eta&updateMask.fieldPaths=note&updateMask.fieldPaths=emailSent12h&updateMask.fieldPaths=emailSent6h&updateMask.fieldPaths=emailSentArrived&updateMask.fieldPaths=lastUpdated'
                                  requests.patch(upd_url, json={'fields': {'eta': {'stringValue': new_eta_str}, 'note': {'stringValue': note_str}, 'lastUpdated': {'stringValue': f"{now_tr_str} (BOT)"}, 'emailSent12h': {'booleanValue': False}, 'emailSent6h': {'booleanValue': False}, 'emailSentArrived': {'booleanValue': False}}}, headers=headers)
                              else:
                                  # Aktifte yoksa arsivden alip Yeni Kayit olustur
                                  archive_match = archive_ships.get(s_name_ex, {}).get('fields', {})
                                  new_ship = {
                                      'fields': {
                                          'userId': {'stringValue': local_id}, 'name': {'stringValue': s_name_ex}, 'status': {'stringValue': 'PENDING'},
                                          'eta': {'stringValue': new_eta_str}, 'note': {'stringValue': note_str + ' [YENİ SEFER (BOT)]'},
                                          'emailSent12h': {'booleanValue': False}, 'emailSent6h': {'booleanValue': False}, 'emailSentArrived': {'booleanValue': False},
                                          'lastUpdated': {'stringValue': f"{now_tr_str} (BOT)"}, 'createdAt': {'stringValue': now_tr.isoformat()},
                                          'imo': archive_match.get('imo', {'stringValue': 'BELİRTİLMEDİ'}),
                                          'voyage': archive_match.get('voyage', {'stringValue': 'YENİ'}),
                                          'originPort': archive_match.get('originPort', {'stringValue': '-'}),
                                          'destinationPort': archive_match.get('destinationPort', {'stringValue': 'ALİAĞA SOCAR'}),
                                          'email': archive_match.get('email', {'stringValue': PANEL_EMAIL}),
                                          'declarations': archive_match.get('declarations', {'integerValue': 0})
                                      }
                                  }
                                  requests.post(db_url, json=new_ship, headers=headers)
                      except Exception as e: print(e)
          mail.logout()
          EOF
          python bot.py
