name: Tam Otonom ETA Botu

on:
  schedule:
    - cron: '0 * * * *' # Botu her saat başı otomatik uyanacak şekilde programlar
  workflow_dispatch: # Test için senin manuel olarak tetiklemene izin verir

jobs:
  mail-okuyucu:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Lojistik ve Veri Kütüphanelerini Yükle
        run: pip install pandas openpyxl requests

      - name: Otonom Bot Kodunu Oluştur ve Çalıştır
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          PANEL_EMAIL: ${{ secrets.PANEL_EMAIL }}
          PANEL_SIFRE: ${{ secrets.PANEL_SIFRE }}
        run: |
          cat << 'EOF' > bot.py
          import os, sys, datetime, imaplib, email, requests
          import pandas as pd

          BOT_EMAIL = os.environ.get('BOT_EMAIL')
          BOT_PASSWORD = os.environ.get('BOT_PASSWORD')
          PANEL_EMAIL = os.environ.get('PANEL_EMAIL')
          PANEL_SIFRE = os.environ.get('PANEL_SIFRE')

          # 1. Firebase Veritabanina Guvenli Giris
          API_KEY = 'AIzaSyAKAF1Tm0Ahy5kT3OW6Slc0sjTbiFvaifg'
          auth_url = f'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={API_KEY}'
          r_auth = requests.post(auth_url, json={'email': PANEL_EMAIL, 'password': PANEL_SIFRE, 'returnSecureToken': True}).json()
          
          if 'idToken' not in r_auth:
              print('Firebase Kimlik Dogrulama Hatasi:', r_auth)
              sys.exit(1)

          id_token = r_auth['idToken']
          local_id = r_auth['localId']

          # 2. Sistemdeki Mevcut Gemileri Cek
          db_url = 'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships'
          query = {
              'structuredQuery': {
                  'from': [{'collectionId': 'ships'}],
                  'where': {
                      'fieldFilter': {
                          'field': {'fieldPath': 'userId'},
                          'op': 'EQUAL',
                          'value': {'stringValue': local_id}
                      }
                  }
              }
          }
          headers = {'Authorization': f'Bearer {id_token}'}
          r_docs = requests.post(db_url + ':runQuery', json=query, headers=headers).json()

          ships = []
          for d in r_docs:
              if 'document' in d:
                  doc = d['document']
                  doc_id = doc['name'].split('/')[-1]
                  name = doc.get('fields', {}).get('name', {}).get('stringValue', '').upper()
                  ships.append({'id': doc_id, 'name': name})

          # 3. IMAP Uzerinden Yeni Gelen Kutusuna Baglan
          try:
              mail = imaplib.IMAP4_SSL('imap.gmail.com')
              mail.login(BOT_EMAIL, BOT_PASSWORD)
              mail.select('inbox')
              status, messages = mail.search(None, '(UNSEEN)')
              mail_ids = messages[0].split()
          except Exception as e:
              print('IMAP Baglanti Hatasi:', e)
              sys.exit(1)

          if not mail_ids:
              print('Okunmamis yeni ETA/ETB maili yok. Bot uyku moduna geciyor.')
              sys.exit(0)

          now = datetime.datetime.now()
          aylar = ['OCAK', 'ŞUBAT', 'MART', 'NİSAN', 'MAYIS', 'HAZİRAN', 'TEMMUZ', 'AĞUSTOS', 'EYLÜL', 'EKİM', 'KASIM', 'ARALIK']
          curr_month = aylar[now.month - 1]
          alt_month = curr_month.replace('Ğ','G').replace('Ü','U').replace('Ş','S').replace('İ','I').replace('Ö','O').replace('Ç','C')

          for m_id in mail_ids:
              status, msg_data = mail.fetch(m_id, '(RFC822)')
              msg = email.message_from_bytes(msg_data[0][1])
              
              for part in msg.walk():
                  if part.get_content_maintype() == 'multipart': continue
                  if part.get('Content-Disposition') is None: continue
                  
                  filename = part.get_filename()
                  if filename and (filename.endswith('.xlsx') or filename.endswith('.xlsm')):
                      print(f'Sistem Excel Eki Buldu: {filename}')
                      with open(filename, 'wb') as f:
                          f.write(part.get_payload(decode=True))
                      
                      try:
                          xls = pd.ExcelFile(filename)
                          target_sheet = xls.sheet_names[0]
                          for s in xls.sheet_names:
                              su = s.upper()
                              if curr_month in su or alt_month in su:
                                  target_sheet = s
                                  break
                          
                          df = pd.read_excel(xls, sheet_name=target_sheet, header=None)
                          name_idx, eta_idx, etb_idx = -1, -1, -1
                          start_row = -1
                          
                          # Radar: Ilk 20 satiri tara tablonun gercek basligini bul
                          for i in range(min(len(df), 20)):
                              row = df.iloc[i].fillna('').astype(str).str.upper().str.strip()
                              for j, val in enumerate(row):
                                  if 'GEMİ ADI' in val or 'GEMI ADI' in val or 'VESSEL' in val: name_idx = j
                                  if val == 'ETA' or 'TAHMİNİ VARIŞ' in val or 'VARIS' in val: eta_idx = j
                                  if val == 'ETB' or 'TAHMİNİ YANAŞMA' in val or 'YANASMA' in val: etb_idx = j
                              if name_idx != -1 and eta_idx != -1:
                                  start_row = i + 1
                                  break
                          
                          if start_row == -1: continue
                          
                          future_runs = {}
                          today_start = now.replace(hour=0, minute=0, second=0, microsecond=0)
                          
                          for i in range(start_row, len(df)):
                              row = df.iloc[i]
                              if pd.isna(row.iloc[name_idx]): continue
                              
                              excel_name = str(row.iloc[name_idx]).strip().upper()
                              raw_eta = row.iloc[eta_idx] if eta_idx != -1 else None
                              raw_etb = row.iloc[etb_idx] if etb_idx != -1 else None
                              
                              if not excel_name or pd.isna(raw_eta): continue
                              
                              def parse_d(val):
                                  if pd.isna(val): return None
                                  if isinstance(val, datetime.datetime): return val
                                  try: return pd.to_datetime(val, dayfirst=True)
                                  except: return None
                              
                              eta_date = parse_d(raw_eta)
                              etb_date = parse_d(raw_etb)
                              
                              target_date = etb_date if (etb_date and not pd.isna(etb_date)) else eta_date
                              
                              # Gecmis (Kirmizi) tarihleri atla, ileri tarihlileri al
                              if target_date and not pd.isna(target_date) and target_date >= today_start:
                                  if excel_name not in future_runs: future_runs[excel_name] = []
                                  future_runs[excel_name].append({
                                      'target_date': target_date,
                                      'etb_str': etb_date.strftime('%d.%m.%Y %H:%M') if (etb_date and not pd.isna(etb_date)) else ''
                                  })
                          
                          # Shuttle ve Guncelleme Islemleri
                          for s_name, runs in future_runs.items():
                              runs.sort(key=lambda x: x['target_date'])
                              closest = runs[0]
                              matched = next((s for s in ships if s['name'] == s_name), None)
                              
                              if matched:
                                  note_str = f'ETB BAZ ALINDI ({closest["etb_str"]})' if closest['etb_str'] else 'ETA BAZ ALINDI (BOT)'
                                  update_url = f'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships/{matched["id"]}?updateMask.fieldPaths=eta&updateMask.fieldPaths=note&updateMask.fieldPaths=emailSent12h&updateMask.fieldPaths=emailSent6h&updateMask.fieldPaths=emailSentArrived'
                                  update_data = {
                                      'fields': {
                                          'eta': {'stringValue': closest['target_date'].strftime('%Y-%m-%dT%H:%M')},
                                          'note': {'stringValue': note_str},
                                          'emailSent12h': {'booleanValue': False}, # Yeni 12 Saat alarmlarini tekrar aktif et
                                          'emailSent6h': {'booleanValue': False},  # Yeni 6 Saat alarmlarini tekrar aktif et
                                          'emailSentArrived': {'booleanValue': False}
                                      }
                                  }
                                  requests.patch(update_url, json=update_data, headers=headers)
                                  print(f'Basariyla Guncellendi: {s_name}')
                      except Exception as e:
                          print('Excel ayrilistirma hatasi:', e)
          
          # Islem bittikten sonra mailleri otomatik olarak okundu isaretler
          mail.logout()
          EOF
          python bot.py

