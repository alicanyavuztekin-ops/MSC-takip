name: Tam Otonom ETA Botu (Sadece Excel)

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch:

jobs:
  excel-botu:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install pandas openpyxl requests

      - name: Otonom Bot Kodunu Çalıştır
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          PANEL_EMAIL: ${{ secrets.PANEL_EMAIL }}
          PANEL_SIFRE: ${{ secrets.PANEL_SIFRE }}
        run: |
          cat << 'EOF' > bot.py
          import os, sys, datetime, imaplib, email, requests
          import pandas as pd

          BOT_EMAIL = os.environ.get('BOT_EMAIL')
          BOT_PASSWORD = os.environ.get('BOT_PASSWORD')
          PANEL_EMAIL = os.environ.get('PANEL_EMAIL')
          PANEL_SIFRE = os.environ.get('PANEL_SIFRE')

          # Veritabanina Baglan
          API_KEY = 'AIzaSyAKAF1Tm0Ahy5kT3OW6Slc0sjTbiFvaifg'
          auth_url = f'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={API_KEY}'
          r_auth = requests.post(auth_url, json={'email': PANEL_EMAIL, 'password': PANEL_SIFRE, 'returnSecureToken': True}).json()
          
          if 'idToken' not in r_auth: sys.exit(1)

          id_token = r_auth['idToken']
          local_id = r_auth['localId']
          headers = {'Authorization': f'Bearer {id_token}'}

          db_url = 'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships'
          query = {
              'structuredQuery': {
                  'from': [{'collectionId': 'ships'}],
                  'where': {
                      'fieldFilter': {
                          'field': {'fieldPath': 'userId'},
                          'op': 'EQUAL',
                          'value': {'stringValue': local_id}
                      }
                  }
              }
          }
          r_docs = requests.post(db_url + ':runQuery', json=query, headers=headers).json()

          ships = []
          for d in r_docs:
              if 'document' in d:
                  doc = d['document']
                  doc_id = doc['name'].split('/')[-1]
                  ships.append({'id': doc_id, 'fields': doc.get('fields', {})})

          now_tr = datetime.datetime.utcnow() + datetime.timedelta(hours=3)
          now_tr_str = now_tr.strftime('%d.%m.%Y %H:%M')

          active_ships = {s['fields'].get('name', {}).get('stringValue', '').upper(): s for s in ships if s['fields'].get('status', {}).get('stringValue', '') != 'COMPLETED'}

          # Excel Okuma Islemi (IMAP)
          try:
              mail = imaplib.IMAP4_SSL('imap.gmail.com')
              mail.login(BOT_EMAIL, BOT_PASSWORD)
              mail.select('inbox')
              status, messages = mail.search(None, '(UNSEEN)')
              mail_ids = messages[0].split()
          except Exception:
              sys.exit(0)

          if not mail_ids: sys.exit(0)

          # Sayfa ismini bulmak için hem Türkçe hem İngilizce ay kısaltmaları
          aylar = ['OCAK', 'ŞUBAT', 'MART', 'NİSAN', 'MAYIS', 'HAZİRAN', 'TEMMUZ', 'AĞUSTOS', 'EYLÜL', 'EKİM', 'KASIM', 'ARALIK']
          eng_months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC']
          curr_month = aylar[now_tr.month - 1]
          alt_month = curr_month.replace('Ğ','G').replace('Ü','U').replace('Ş','S').replace('İ','I').replace('Ö','O').replace('Ç','C')
          eng_mon = eng_months[now_tr.month - 1]

          for m_id in mail_ids:
              status, msg_data = mail.fetch(m_id, '(RFC822)')
              msg = email.message_from_bytes(msg_data[0][1])
              
              for part in msg.walk():
                  if part.get_content_maintype() == 'multipart' or part.get('Content-Disposition') is None: continue
                  filename = part.get_filename()
                  
                  # Sadece .xlsx ve .xlsm dosyalarını kabul et
                  if filename and (filename.endswith('.xlsx') or filename.endswith('.xlsm')):
                      with open(filename, 'wb') as f: f.write(part.get_payload(decode=True))
                      
                      try:
                          # xlsm uyumluluğu için engine='openpyxl' eklendi
                          xls = pd.ExcelFile(filename, engine='openpyxl')
                          target_sheet = xls.sheet_names[0]
                          
                          for s_name in xls.sheet_names:
                              s_upper = s_name.upper()
                              if curr_month in s_upper or alt_month in s_upper or eng_mon in s_upper:
                                  target_sheet = s_name
                                  break
                          
                          df = pd.read_excel(xls, sheet_name=target_sheet, header=None)
                          name_idx, eta_idx, etb_idx, start_row = -1, -1, -1, -1
                          
                          for i in range(min(len(df), 20)):
                              row = df.iloc[i].fillna('').astype(str).str.upper().str.strip()
                              for j, val in enumerate(row):
                                  if 'GEMİ ADI' in val or 'VESSEL' in val: name_idx = j
                                  if 'ETA' in val or 'VARIS' in val or 'VARIŞ' in val or 'ARRIVAL' in val: eta_idx = j
                                  if 'ETB' in val or 'YANASMA' in val or 'YANAŞMA' in val or 'BERTH' in val: etb_idx = j
                              
                              # Gemi adı ve (ETA veya ETB'den en az biri) bulunduysa başla
                              if name_idx != -1 and (eta_idx != -1 or etb_idx != -1):
                                  start_row = i + 1
                                  break
                          
                          if start_row == -1: continue
                          
                          future_runs = {}
                          today_start = now_tr.replace(hour=0, minute=0, second=0, microsecond=0)
                          
                          for i in range(start_row, len(df)):
                              row = df.iloc[i]
                              if pd.isna(row.iloc[name_idx]): continue
                              excel_name = str(row.iloc[name_idx]).strip().upper()
                              
                              raw_eta = row.iloc[eta_idx] if eta_idx != -1 else None
                              raw_etb = row.iloc[etb_idx] if etb_idx != -1 else None
                              
                              # Gemi adı yoksa VEYA (ETA ve ETB'nin ikisi birden boşsa) satırı atla
                              if not excel_name or (pd.isna(raw_eta) and pd.isna(raw_etb)): continue
                              
                              def parse_d(val):
                                  if pd.isna(val): return None
                                  if isinstance(val, datetime.datetime): return val
                                  try: return pd.to_datetime(val, dayfirst=True)
                                  except: return None
                              
                              eta_date, etb_date = parse_d(raw_eta), parse_d(raw_etb)
                              
                              # === KESİN ÖNCELİK MANTIĞI ===
                              target_date = None
                              is_etb_used = False
                              
                              if etb_date and not pd.isna(etb_date):
                                  target_date = etb_date
                                  is_etb_used = True
                              elif eta_date and not pd.isna(eta_date):
                                  target_date = eta_date
                                  is_etb_used = False
                              else:
                                  continue # İki tarih de okunamadıysa geç
                              
                              if target_date and target_date >= today_start:
                                  if excel_name not in future_runs: future_runs[excel_name] = []
                                  future_runs[excel_name].append({
                                      'target_date': target_date, 
                                      'is_etb_used': is_etb_used,
                                      'date_str': target_date.strftime('%d.%m.%Y %H:%M')
                                  })
                          
                          for s_name_ex, runs in future_runs.items():
                              runs.sort(key=lambda x: x['target_date'])
                              closest = runs[0]
                              
                              # SADECE AKTİF LİSTEDE VARSA GÜNCELLE
                              if s_name_ex in active_ships:
                                  # Hangi verinin baz alındığını net olarak panele yazdırır
                                  if closest['is_etb_used']:
                                      note_str = f'ETB BAZ ALINDI ({closest["date_str"]})'
                                  else:
                                      note_str = f'ETA BAZ ALINDI ({closest["date_str"]})'
                                      
                                  new_eta_str = closest['target_date'].strftime('%Y-%m-%dT%H:%M')
                                  
                                  matched_id = active_ships[s_name_ex]['id']
                                  upd_url = f'https://firestore.googleapis.com/v1/projects/msc-takip/databases/(default)/documents/ships/{matched_id}?updateMask.fieldPaths=eta&updateMask.fieldPaths=note&updateMask.fieldPaths=emailSent12h&updateMask.fieldPaths=emailSent6h&updateMask.fieldPaths=emailSentArrived&updateMask.fieldPaths=lastUpdated'
                                  requests.patch(upd_url, json={'fields': {'eta': {'stringValue': new_eta_str}, 'note': {'stringValue': note_str}, 'lastUpdated': {'stringValue': f"{now_tr_str} (BOT)"}, 'emailSent12h': {'booleanValue': False}, 'emailSent6h': {'booleanValue': False}, 'emailSentArrived': {'booleanValue': False}}}, headers=headers)
                                  
                      except Exception as e: print(f"Excel Isleme Hatasi: {e}")
          mail.logout()
          EOF
          python bot.py
